version: '3'

vars:
  PORT: '{{.PORT | default "67"}}'
  MODEL: '{{.MODEL | default "./models/grug-3b/model"}}'
  URL: http://127.0.0.1:{{.PORT | default "67"}}
  PYTHON_VERSION: '3.11'
  RUN: uv run --python {{.PYTHON_VERSION}} --with-requirements requirements.txt python

tasks:
  setup:
    desc: Download the model weights (one-time, ~8GB)
    cmds:
      - uv run --python {{.PYTHON_VERSION}} --with huggingface_hub huggingface-cli download ProCreations/grug-3b --local-dir {{.MODEL}}

  serve:
    desc: Run the server in the foreground
    cmds:
      - '{{.RUN}} scripts/serve.py --model-path {{.MODEL}} --port {{.PORT}}'

  start:
    desc: Start the server in the background
    cmds:
      - cmd: powershell -NoProfile -Command "Start-Process -WindowStyle Hidden -FilePath 'cmd.exe' -ArgumentList '/c','{{.RUN}} scripts/serve.py --model-path {{.MODEL}} --port {{.PORT}}'"
        platforms: [windows]
      - cmd: nohup {{.RUN}} scripts/serve.py --model-path {{.MODEL}} --port {{.PORT}} > /tmp/rocky-server.log 2>&1 &
        platforms: [linux, darwin]
      - echo "started on {{.URL}}"

  stop:
    desc: Kill whatever owns the port
    cmds:
      - cmd: powershell -NoProfile -Command "Get-NetTCPConnection -LocalPort {{.PORT}} -ErrorAction SilentlyContinue | ForEach-Object { taskkill /F /PID $_.OwningProcess 2>$null | Out-Null }"
        platforms: [windows]
      - cmd: lsof -ti tcp:{{.PORT}} | xargs -r kill -9
        platforms: [linux, darwin]
      - echo "stopped"

  restart:
    cmds:
      - task: stop
      - task: start

  status:
    desc: Show whether the server is up
    cmds:
      - cmd: powershell -NoProfile -Command "if (Get-NetTCPConnection -LocalPort {{.PORT}} -ErrorAction SilentlyContinue) { 'up  {{.URL}}' } else { 'down' }"
        platforms: [windows]
      - cmd: 'lsof -ti tcp:{{.PORT}} >/dev/null && echo "up  {{.URL}}" || echo "down"'
        platforms: [linux, darwin]

  open:
    desc: Open the UI in the default browser
    cmds:
      - cmd: powershell -NoProfile -Command "Start-Process '{{.URL}}'"
        platforms: [windows]
      - cmd: open "{{.URL}}"
        platforms: [darwin]
      - cmd: xdg-open "{{.URL}}"
        platforms: [linux]
